name: Trigger auto deployment for contoso-travel

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/contoso-travel-AutoDeployTrigger-30fda4ca-4f0d-4694-bbdb-704a9764a15f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTOSOTRAVEL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTOSOTRAVEL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTOSOTRAVEL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: contosotravelacr2580.azurecr.io
          registryUsername: ${{ secrets.CONTOSOTRAVEL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTOSOTRAVEL_REGISTRY_PASSWORD }}
          containerAppName: contoso-travel
          resourceGroup: DEM330-RG
          imageToBuild: contosotravelacr2580.azurecr.io/contoso-travel:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


